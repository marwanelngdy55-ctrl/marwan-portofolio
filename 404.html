<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark">
<script>(function(){try{var t=localStorage.getItem('marwan-portfolio-theme');if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<title>الصفحة غير موجودة | مروان النجدي</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@500;600;700;800;900&family=Cairo:wght@400;500;600;700;800&family=Manrope:wght@500;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
  .notfound{ min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:24px; }
  .notfound__code{ font-family:var(--font-mono); font-size:clamp(64px,14vw,120px); font-weight:800; color:var(--accent); line-height:1; letter-spacing:-0.03em; }
  .notfound__title{ font-size:clamp(22px,4vw,30px); font-weight:800; margin:18px 0 10px; }
  .notfound__desc{ color:var(--text-muted); font-size:16px; max-width:460px; margin-bottom:32px; }
  .notfound__actions{ display:flex; gap:12px; flex-wrap:wrap; justify-content:center; }
</style>
</head>
<body>

<nav class="nav" id="nav">
  <div class="nav__inner">
    <a href="index.html" class="nav__brand">
      <span class="nav__brand-mark">SEO</span>
      <span class="nav__brand-text">مروان النجدي</span>
    </a>
    <div class="nav__actions">
      <button class="theme-toggle" id="theme-toggle" aria-label="تبديل الوضع الليلي/النهاري">
        <svg class="icon icon--sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg class="icon icon--moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z"/></svg>
      </button>
    </div>
  </div>
</nav>

<main>
  <div class="notfound">
    <span class="notfound__code">404</span>
    <h1 class="notfound__title">الصفحة اللي بتدور عليها مش موجودة</h1>
    <p class="notfound__desc">يمكن الرابط اتغيّر أو اتنقل. جرب ترجع للصفحة الرئيسية أو تشوف أحدث المقالات في المدونة.</p>
    <div class="notfound__actions">
      <a href="index.html" class="btn btn--primary">الرجوع للرئيسية</a>
      <a href="blog.html" class="btn btn--ghost">تصفح المدونة</a>
    </div>
  </div>
</main>

<script>
(function(){
  var root = document.body;
  var themeToggle = document.getElementById('theme-toggle');
  var THEME_KEY = 'marwan-portfolio-theme';
  var current = document.documentElement.getAttribute('data-theme') || 'dark';
  if (themeToggle) {
    themeToggle.addEventListener('click', function(){
      current = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', current);
      try { localStorage.setItem(THEME_KEY, current); } catch(e){}
    });
  }
})();
</script>
</body>
</html>
